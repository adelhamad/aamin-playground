<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview build · aamin playground</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Avenir, "Segoe UI", sans-serif;
      background: #d9ddff;
      color: #101749;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #d9ddff;
      background-image:
        linear-gradient(rgba(52, 65, 204, .13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(52, 65, 204, .13) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    body::before {
      position: fixed;
      top: -.12em;
      right: -.04em;
      content: "02";
      color: rgba(52, 65, 204, .14);
      font: 900 min(52vw, 560px)/1 Inter, Avenir, "Segoe UI", sans-serif;
      letter-spacing: -.1em;
    }

    main {
      position: relative;
      width: min(720px, calc(100% - 32px));
      padding: clamp(32px, 7vw, 72px);
      border: 2px solid #101749;
      background: #f7f4ed;
      box-shadow: 14px 14px 0 #5661e9;
    }

    .label {
      display: inline-block;
      margin: 0 0 48px;
      padding: 7px 10px;
      background: #101749;
      color: #fff;
      font: 700 12px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-size: clamp(54px, 12vw, 108px);
      font-weight: 900;
      letter-spacing: -.075em;
      line-height: .8;
      text-transform: uppercase;
    }

    p {
      max-width: 42ch;
      margin: 32px 0 0;
      font-size: clamp(16px, 2.4vw, 20px);
      line-height: 1.5;
    }

    .stamp {
      position: absolute;
      right: clamp(18px, 5vw, 44px);
      bottom: clamp(18px, 5vw, 40px);
      width: 92px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid #ff4f8b;
      border-radius: 50%;
      color: #ff286e;
      font: 800 11px/1.1 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(9deg);
    }

    @media (max-width: 560px) {
      .label { margin-bottom: 36px; }
      .stamp { position: static; margin: 40px 0 0 auto; }
    }
  </style>
</head>
<body>
  <main>
    <div class="label">02 / image source: preview.Dockerfile</div>
    <h1>Adel Preview build</h1>
    <p>This blue blueprint screen means the image was built from <strong>preview.Dockerfile</strong>.</p>
    <div class="stamp" aria-label="Preview variant">safe to<br>experiment</div>
  </main>
</body>
</html>
